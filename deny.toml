# cargo-deny configuration (ARCHITECTURE.md §3.3, §10).

[advisories]
yanked = "deny"

[licenses]
# The licence of the project is not decided yet. The workspace crates have no
# licence field and are not published, so they are skipped here.
private = { ignore = true }
# Permissive licences only, so that the later decision stays open.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

# tiny-keccak comes in through arrow-array -> ahash -> const-random on wasm32 only.
# CC0-1.0 is a public-domain dedication.
[[licenses.exceptions]]
crate = "tiny-keccak"
allow = ["CC0-1.0"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# cargo-deny configuration (ARCHITECTURE.md §3.3, §10).

[advisories]
yanked = "deny"

[licenses]
# Licences that may be combined into an AGPL-3.0 work (see LICENSE).
allow = [
    "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

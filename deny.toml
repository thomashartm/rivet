# cargo-deny configuration (ARCHITECTURE.md §3.3, §10).

[advisories]
yanked = "deny"

[licenses]
# Licences that may be combined into an AGPL-3.0 work (see LICENSE).
allow = [
    "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

# tiny-keccak comes in through arrow-array -> ahash -> const-random on wasm32 only.
# CC0-1.0 is a public-domain dedication and is compatible with the AGPL.
[[licenses.exceptions]]
crate = "tiny-keccak"
allow = ["CC0-1.0"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

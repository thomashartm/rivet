[package]
name = "rivet-core"
description = "Rivet core: extension host, registry, buses, core services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
rivet-sdk = { path = "../rivet-sdk" }
semver = "1.0.28"
tokio = { version = "1.54.1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

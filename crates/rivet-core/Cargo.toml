[package]
name = "rivet-core"
description = "Rivet core: extension host, registry, buses, core services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
arrow-array = { version = "60.2.0", default-features = false }
futures-core = "0.3.34"
keyring = "4.2.0"
minisign-verify = "=0.3.0"
rivet-sdk = { path = "../rivet-sdk" }
semver = "1.0.28"
serde = "1.0.229"
serde_json = "1.0.154"
tar = { version = "=0.4.46", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
toml = { version = "1", default-features = false, features = ["display", "parse", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std", "smallvec"] }
wasmtime = { version = "=51.0.0", default-features = false, features = ["runtime", "component-model", "cranelift", "std"] }
zeroize = "1.9.2"

[target.'cfg(unix)'.dependencies]
# `kill_process_group` and `waitid` without `unsafe` (ADR-0024, R-87).
rustix = { version = "1.1.6", features = ["process"] }

[dev-dependencies]
minisign = "=0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "test-util"] }
# Exact: this version builds the WASM test components from WAT text.
wat = "=1.263.0"

[[test]]
name = "native_process"
# The test program is also the child process of the tests.
harness = false

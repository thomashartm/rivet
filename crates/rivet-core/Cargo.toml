[package]
name = "rivet-core"
description = "Rivet core: extension host, registry, buses, core services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
keyring = "4.2.0"
minisign-verify = "=0.3.0"
rivet-sdk = { path = "../rivet-sdk" }
semver = "1.0.28"
serde = "1.0.229"
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }
toml = { version = "1", default-features = false, features = ["display", "parse", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std", "smallvec"] }
wasmtime = { version = "=51.0.0", default-features = false, features = ["runtime", "component-model", "cranelift", "std"] }
zeroize = "1.9.2"

[dev-dependencies]
minisign = "=0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "test-util"] }
wat = "1.263.0"

[package]
name = "rivet-core"
description = "Rivet core: extension host, registry, buses, core services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
keyring = "4.2.0"
rivet-sdk = { path = "../rivet-sdk" }
semver = "1.0.28"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std", "smallvec"] }
zeroize = "1.9.2"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

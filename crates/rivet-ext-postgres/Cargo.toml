[package]
name = "rivet-ext-postgres"
description = "The PostgreSQL driver extension of rivet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
arrow-array = { version = "60.2.0", default-features = false }
arrow-schema = { version = "60.2.0", default-features = false }
futures-core = "0.3.34"
rivet-sdk = { path = "../rivet-sdk" }
tokio = { version = "1.54.1", features = ["io-util", "net", "rt", "sync", "time"] }
# Without the default `runtime` feature: the driver opens its sockets itself.
tokio-postgres = { version = "0.7.18", default-features = false }

[dev-dependencies]
rivet-testkit = { path = "../rivet-testkit" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "test-util"] }

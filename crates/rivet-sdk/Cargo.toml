[package]
name = "rivet-sdk"
description = "Public extension contract for rivet: traits, manifest schema, canonical data types, error types."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
arrow-array = { version = "60.2.0", default-features = false }
arrow-schema = { version = "60.2.0", default-features = false }
futures-core = "0.3.34"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
zeroize = "1.9.2"

[dev-dependencies]
# Tests write profiles and catalogs as TOML.
toml = { version = "1", default-features = false, features = ["display"] }

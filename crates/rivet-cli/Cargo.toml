[package]
name = "rivet-cli"
description = "The rivet command line client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "rivet"
path = "src/main.rs"

[dependencies]
arrow-array = { version = "60.2.0", default-features = false }
arrow-schema = { version = "60.2.0", default-features = false }
futures-core = "0.3.34"
percent-encoding = "2.3.2"
rivet-core = { path = "../rivet-core" }
# shortcut: the drivers are linked directly, against ARCHITECTURE.md §3.2
# footnote 1; load them through the extension host once it can hand out a driver.
rivet-ext-mysql = { path = "../rivet-ext-mysql" }
rivet-ext-postgres = { path = "../rivet-ext-postgres" }
rivet-sdk = { path = "../rivet-sdk" }
# Reads the password of `rivet save` without echo.
rpassword = "7.5.5"
# Line editing and history at the prompt.
rustyline = { version = "19.0.0", default-features = false, features = ["with-file-history"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
# Writes a TOML string for `rivet save`.
toml = { version = "1", default-features = false, features = ["display"] }
url = "2.5.9"

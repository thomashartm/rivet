[package]
name = "rivet-cli"
description = "The rivet command line client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "rivet"
path = "src/main.rs"

[dependencies]
arrow-array = { version = "60.2.0", default-features = false }
arrow-schema = { version = "60.2.0", default-features = false }
futures-core = "0.3.34"
percent-encoding = "2.3.2"
# shortcut: linked directly, against ARCHITECTURE.md §3.2 footnote 1; load it
# through the extension host once the host can hand out a driver.
rivet-ext-postgres = { path = "../rivet-ext-postgres" }
rivet-sdk = { path = "../rivet-sdk" }
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
url = "2.5.9"

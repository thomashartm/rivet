# Local databases to try rivet with. Not for tests (see compose.test.yml).
#
#   Start: docker/playground.sh   (writes .env in the repository root on the first run)
#   Stop:  docker compose --env-file .env -f docker/compose.playground.yml down
#   Reset: the same with `down -v` (deletes the data), then delete .env
#
# The credentials come from the generated .env; it is never committed.
# Ports are on loopback only and differ from the defaults (5432, 3306), so
# local servers keep working.
#
# Both servers use TLS with the throwaway certificate of docker/test-certs.sh
# (host name `localhost`, CA docker/test-certs/ca.pem), the same files as the
# TLS container tests. Plaintext is still accepted, for `?tls=off`.
name: rivet-playground

services:
  # Writes the TLS files once; the servers start after it.
  tls-certs:
    image: postgres:18.7
    entrypoint: ["sh", "/test-certs.sh"]
    volumes:
      - ./test-certs.sh:/test-certs.sh:ro
      - ./test-certs:/certs

  postgres:
    image: postgres:18.7
    depends_on:
      tls-certs:
        condition: service_completed_successfully
    # PostgreSQL wants its key private to its user: a copy, owned by postgres.
    entrypoint:
      - sh
      - -c
      - >-
        install -o postgres -m 600 /certs/server.key /tmp/server.key &&
        exec docker-entrypoint.sh postgres -c ssl=on
        -c ssl_cert_file=/certs/server.pem -c ssl_key_file=/tmp/server.key
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run docker/playground.sh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run docker/playground.sh}
      POSTGRES_DB: ${POSTGRES_DB:?run docker/playground.sh}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - playground-data:/var/lib/postgresql
      - ./playground/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./test-certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host=127.0.0.1 --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.4.13
    depends_on:
      tls-certs:
        condition: service_completed_successfully
    command: ["--ssl-cert=/certs/server.pem", "--ssl-key=/certs/server.key"]
    environment:
      MYSQL_USER: ${MYSQL_USER:?run docker/playground.sh}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?run docker/playground.sh}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run docker/playground.sh}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?run docker/playground.sh}
    ports:
      - "127.0.0.1:53306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./playground/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./test-certs:/certs:ro
    healthcheck:
      # TCP, not the socket: the setup server has no network.
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=$${MYSQL_USER} --password=$${MYSQL_PASSWORD}"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  playground-data:  # the PostgreSQL data; the name predates MySQL
  mysql-data:
